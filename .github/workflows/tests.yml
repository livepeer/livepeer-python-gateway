name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: gateway-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install pinned lint dependencies
        run: uv sync --locked --group lint
      - name: Run Ruff
        run: uv run --frozen --group lint ruff check .

  pytest:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked test dependencies
        run: uv sync --locked --group test
      - name: Run pytest with coverage
        run: uv run --frozen --group test pytest --cov=livepeer_gateway --cov-branch --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'
      - name: Build the wheel and source distribution without publishing
        run: uv build --no-sources

  ci-gate:
    name: ci-gate
    if: always()
    needs: [ruff, pytest, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          RUFF_RESULT: ${{ needs.ruff.result }}
          PYTEST_RESULT: ${{ needs.pytest.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$RUFF_RESULT" = success
          test "$PYTEST_RESULT" = success
          test "$PACKAGE_RESULT" = success
