name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install pinned lint dependencies
        run: uv sync --locked --group lint
      - name: Run Ruff on changed Python
        env:
          RUFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run --frozen --group lint python scripts/lint_changed.py

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked test dependencies
        run: uv sync --locked --group test
      - name: Run pytest with coverage
        run: uv run --frozen --group test pytest --cov=livepeer_gateway --cov-branch --cov-report=term-missing
