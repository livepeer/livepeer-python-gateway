[project]
name = "agent-explorer-demo"
version = "0.1.0"
description = "Demo agent: Alchemy wallet + PymtHouse Ed25519 register + hosted MCP + LV2V job via livepeer_gateway."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "httpx>=0.27",
    "livepeer-gateway",
    "mcp[cli]>=1.6",
    "python-dotenv>=1.0",
]

[project.scripts]
agent-explorer-demo = "agent_explorer_demo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_explorer_demo"]

[tool.hatch.build.targets.wheel.sources]
"src/agent_explorer_demo" = "agent_explorer_demo"

[tool.uv.sources]
livepeer-gateway = { path = "../..", editable = true }
